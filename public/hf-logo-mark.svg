<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="hfTitle hfDesc">
<title id="hfTitle">Hustle First HF Shield</title>
<desc id="hfDesc">Interlocking architectural brushed-steel H and F inside a faceted dark metal shield with sharp restrained teal perimeter light.</desc>
<defs>
<linearGradient id="rim" x1="0" y1="0" x2=".92" y2="1"><stop stop-color="#ecf3f4"/><stop offset=".15" stop-color="#53636a"/><stop offset=".34" stop-color="#dce5e6"/><stop offset=".52" stop-color="#25343b"/><stop offset=".72" stop-color="#9eadaf"/><stop offset="1" stop-color="#111d21"/></linearGradient>
<linearGradient id="face" x1=".06" y1="0" x2=".92" y2="1"><stop stop-color="#ffffff"/><stop offset=".14" stop-color="#99a6a9"/><stop offset=".3" stop-color="#e1e8e8"/><stop offset=".48" stop-color="#59666c"/><stop offset=".63" stop-color="#c6d2d4"/><stop offset=".81" stop-color="#5f6d74"/><stop offset="1" stop-color="#edf5f5"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#233840"/><stop offset=".48" stop-color="#091318"/><stop offset="1" stop-color="#01666c"/></linearGradient>
<linearGradient id="cavity" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151f23"/><stop offset=".55" stop-color="#05090b"/><stop offset="1" stop-color="#06252a"/></linearGradient>
<linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8fffa"/><stop offset=".26" stop-color="#00f3e2"/><stop offset=".72" stop-color="#00a8ac"/><stop offset="1" stop-color="#004b53"/></linearGradient>
<filter id="edgeLight" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="4.6"/></filter>
<filter id="letterShadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="3" dy="6" stdDeviation="2.8" flood-color="#000b0e" flood-opacity=".94"/></filter>
</defs>
<!-- Neon is only an edge, not an opaque square behind the brand mark. -->
<path d="M159 11 210 44 269 34 299 62 295 226 159 312 24 228 20 62 51 34 107 45Z" fill="none" stroke="#00e9db" stroke-width="7" opacity=".60" filter="url(#edgeLight)"/>
<!-- Machined angular exterior and deliberately open crown facets. -->
<path d="M159 12 209 44 270 35 298 64 292 227 159 308 26 227 22 64 50 35 108 45Z" fill="url(#rim)" stroke="#061114" stroke-width="3"/>
<path d="M159 24 205 58 264 47 285 72 280 219 159 295 39 219 35 73 56 48 110 59Z" fill="url(#cavity)" stroke="#00cbbf" stroke-width="2.6"/>
<path d="M41 76 109 65 157 32 207 67 263 54" fill="none" stroke="#eaf8f6" stroke-width="3.2" opacity=".78"/>
<path d="M26 66 41 77 40 218 159 295 280 217 282 74 296 64" fill="none" stroke="#00b6b7" stroke-width="3.3" opacity=".91"/>
<path d="M34 79 54 63 109 73 159 39 207 72 263 60 281 79" fill="none" stroke="#0a181b" stroke-width="6"/>
<path d="M31 71 57 44 110 57 159 20 207 56 266 43 291 73" fill="none" stroke="url(#teal)" stroke-width="2.5" opacity=".94"/>
<path d="M39 219 158 294 282 216" fill="none" stroke="#95f7ef" stroke-width="2" opacity=".55"/>
<path d="M159 31v9m-99 16-11 11m215-11 9 11" stroke="#fff" stroke-width="3.2" opacity=".55"/>
<!-- Extruded inset shadows of each letter (both are separate metal-machined shapes). -->
<g filter="url(#letterShadow)">
<path d="M56 86 104 109 104 167 149 188 149 133 188 112 188 268 149 289 149 232 104 211 104 250 56 226Z" transform="translate(7 8)" fill="url(#side)" stroke="#008a90" stroke-width="2"/>
<path d="M188 118 263 79 271 97 271 125 231 147 231 171 262 154 262 188 231 205 231 266 188 290Z" transform="translate(7 8)" fill="url(#side)" stroke="#00868d" stroke-width="2"/>
<!-- The H reads as two substantial uprights joined by one diagonal structural bridge. -->
<path d="M56 86 104 109 104 167 149 188 149 133 188 112 188 268 149 289 149 232 104 211 104 250 56 226Z" fill="url(#face)" stroke="#e2eeed" stroke-width="2.2" stroke-linejoin="miter"/>
<!-- F is a separate beveled column with two projecting shelves. -->
<path d="M188 118 263 79 271 97 271 125 231 147 231 171 262 154 262 188 231 205 231 266 188 290Z" fill="url(#face)" stroke="#ecf3f2" stroke-width="2" stroke-linejoin="miter"/>
</g>
<!-- Facets emphasize real metallic construction rather than a flat gradient icon. -->
<path d="M58 88 71 96 71 231 58 224Z" fill="#f1faf9" opacity=".40"/>
<path d="M94 110 104 114 104 167 149 188 149 202 94 175Z" fill="#ffffff" opacity=".28"/>
<path d="M149 133 160 126 160 275 149 286Z" fill="#0b1c24" opacity=".46"/>
<path d="M175 119 188 113 188 268 175 276Z" fill="#f4ffff" opacity=".29"/>
<path d="M189 118 201 112 201 278 189 284Z" fill="#1f363d" opacity=".52"/>
<path d="M201 111 263 79 269 92 203 128Z" fill="#f6ffff" opacity=".44"/>
<path d="M232 171 262 154 262 164 231 182Z" fill="#f1fbfc" opacity=".36"/>
<path d="M56 226 104 250m45 39 39-21m43-2 40-26" fill="none" stroke="#0a171b" stroke-width="2.6" opacity=".85"/>
<!-- Subtle sparking edge cuts from the original industrial brand language. -->
<path d="M25 59 24 43m7 13-11-10M295 58l8-16m-17 13 19-7M110 42l-8-15M212 42l6-16" stroke="#00e5d6" stroke-width="1.5" stroke-linecap="square" opacity=".62"/>
<path d="M36 80v40m250-42v54M159 303l-17-11" stroke="#7ffff4" stroke-width="1.8" opacity=".52"/>
</svg>