name: ABL QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abl-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate database schema
        run: npm run db:validate

      - name: Verify database connectivity
        run: npm run db:verify

      - name: Build
        run: npm run build

      - name: Browser geometry QA (no deployment)
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/hf-start.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          node scripts/qa-home-geometry.mjs

      - name: Save real browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hustle-first-abl39-layout-qa
          path: qa-artifacts/
          if-no-files-found: ignore
